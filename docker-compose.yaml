# nginx proxy address - http://172.17.0.1:3000

name: plane
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: makeplane/plane-web:latest
    container_name: plane-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
    ports:
      - '172.17.0.1:3000:3000'
    volumes:
      - './volumes/data/plane:/data'
    networks:
      - plane

networks:
  plane:
    name: plane
    external: false
